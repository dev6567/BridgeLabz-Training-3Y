<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Cards</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; padding: 20px; }
    #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center; }
    .card img { height: 160px; max-width: 100%; object-fit: contain; }
    .card h3 { font-size: 14px; }
    .card p { font-weight: bold; color: #2d6cdf; }
    #error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Products</h2>
  <div id="error"></div>
  <div id="products"></div>
  <script src="q6_product_fetcher.js"></script>
</body>
</html>
