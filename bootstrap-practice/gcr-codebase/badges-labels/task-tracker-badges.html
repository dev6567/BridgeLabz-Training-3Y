<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task-tracker-badges.css">
</head>
<body>
    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">My Tasks</h1>
            <!-- badge counter in the header: rounded-pill makes it a pill shape -->
            <span class="fs-6">Pending <span class="badge rounded-pill bg-danger">4</span></span>
        </div>
    </header>

    <main class="container my-4">
        <!-- list-group + d-flex puts the task name on the left and its badge on the right -->
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Submit Bootstrap assignment
                <span class="badge bg-danger">High</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Revise CSS Grid notes
                <span class="badge bg-warning text-dark">Medium</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Update GitHub README
                <span class="badge bg-success">Low</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Practice 3 LeetCode problems
                <span class="badge bg-warning text-dark">Medium</span>
            </li>
        </ul>

        <!-- Button with an embedded badge -->
        <button type="button" class="btn btn-primary mt-4">
            Completed <span class="badge text-bg-light">12</span>
        </button>
    </main>

    <footer class="text-center py-3 border-top">
        <p class="mb-0">&copy; 2025 Task Tracker</p>
    </footer>
</body>
</html>
