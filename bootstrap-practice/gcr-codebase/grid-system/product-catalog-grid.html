<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - Bootstrap Grid</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-catalog-grid.css">
</head>
<body>
    <header class="bg-dark text-white text-center py-4">
        <h1 class="h2 mb-0">ShopEasy Catalog</h1>
    </header>

    <main class="container my-4">
        <!-- Grid: col-12 = 1 column on mobile, col-sm-6 = 2 columns on tablets, col-md-3 = 4 columns on larger screens. g-4 adds gaps -->
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm product-card">
                    <img src="product1.jpg" class="card-img-top" alt="Wireless headphones">
                    <div class="card-body text-center">
                        <h2 class="h5 card-title">Wireless Headphones</h2>
                        <p class="card-text fw-bold">&#8377;2,499</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm product-card">
                    <img src="product2.jpg" class="card-img-top" alt="Smart watch">
                    <div class="card-body text-center">
                        <h2 class="h5 card-title">Smart Watch</h2>
                        <p class="card-text fw-bold">&#8377;3,999</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm product-card">
                    <img src="product3.jpg" class="card-img-top" alt="Laptop backpack">
                    <div class="card-body text-center">
                        <h2 class="h5 card-title">Laptop Backpack</h2>
                        <p class="card-text fw-bold">&#8377;1,299</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm product-card">
                    <img src="product4.jpg" class="card-img-top" alt="Wireless mouse">
                    <div class="card-body text-center">
                        <h2 class="h5 card-title">Wireless Mouse</h2>
                        <p class="card-text fw-bold">&#8377;799</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2025 ShopEasy</p>
    </footer>
</body>
</html>
