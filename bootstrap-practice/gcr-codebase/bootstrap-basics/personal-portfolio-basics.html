<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Sharma - Portfolio</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="personal-portfolio-basics.css">
</head>
<body>
    <!-- bg-light + text-dark = light background with dark text; p-5 = large padding -->
    <header class="bg-light text-dark text-center p-5">
        <h1 class="fw-bold">Dev Sharma</h1>
        <p class="lead mb-0">Aspiring Web Developer | Learning HTML, CSS and Bootstrap</p>
    </header>

    <main class="container text-center">
        <!-- img-fluid keeps the image responsive; rounded-circle makes it round; mt-4 = top margin -->
        <section class="mt-4 mb-3">
            <img src="profile.jpg" alt="Profile photo of Dev Sharma" class="img-fluid rounded-circle profile-img">
            <p class="mt-3">I enjoy building clean, responsive websites and solving coding problems.</p>
            <!-- Two buttons: btn-primary (filled) and btn-outline-dark (outlined) -->
            <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
            <a href="#" class="btn btn-outline-dark">Download CV</a>
        </section>

        <!-- Small contact form: form-control styles inputs, col-md-6 + mx-auto centres it -->
        <section id="contact" class="mt-5 mb-4">
            <h2 class="mb-3">Contact Me</h2>
            <form class="col-md-6 mx-auto text-start">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Your name">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com">
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" rows="3" placeholder="How can I help?"></textarea>
                </div>
                <button type="submit" class="btn btn-dark">Send</button>
            </form>
        </section>
    </main>

    <footer class="bg-light text-center p-3">
        <p class="mb-0">&copy; 2025 Dev Sharma</p>
    </footer>
</body>
</html>
