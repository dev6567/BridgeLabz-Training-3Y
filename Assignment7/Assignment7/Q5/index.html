<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Gallery</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; padding: 30px; }
    #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 660px; }
    #gallery img { width: 100%; border-radius: 6px; cursor: pointer; transition: transform .2s; }
    #gallery img:hover { transform: scale(1.04); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: #fff; padding: 12px; border-radius: 8px; max-width: 90vw; text-align: center; }
    .modal-content img { max-width: 100%; max-height: 70vh; display: block; }
    .modal-content button { margin-top: 8px; padding: 6px 14px; border: 0; border-radius: 4px; background: #2d6cdf; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Image Gallery</h2>
  <div id="gallery"></div>

  <div id="modal" class="modal-overlay">
    <div class="modal-content" id="modal-content">
      <img id="modal-image" src="" alt="">
      <button id="modal-close" type="button">Close</button>
    </div>
  </div>
  <script src="q5_image_gallery.js"></script>
</body>
</html>
