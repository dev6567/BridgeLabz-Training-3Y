<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Submit Blocker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding: 30px; }
    form { background: #fff; padding: 24px; border-radius: 8px; width: 340px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 4px; }
    input.invalid { border-color: red; }
    .error { color: red; font-size: 13px; min-height: 16px; margin-top: 3px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 4px; background: #2d6cdf; color: #fff; cursor: pointer; }
    #success { color: green; font-weight: bold; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <form id="signup-form" action="/submit" method="post" novalidate>
    <h2>Sign Up</h2>
    <div class="field"><label for="name">Name</label><input id="name" type="text"><div class="error" id="name-error"></div></div>
    <div class="field"><label for="email">Email</label><input id="email" type="text"><div class="error" id="email-error"></div></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password"><div class="error" id="password-error"></div></div>
    <button type="submit">Submit</button>
    <div id="success"></div>
  </form>
  <script src="q9_submit_blocker.js"></script>
</body>
</html>
