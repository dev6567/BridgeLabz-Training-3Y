<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block vs Inline Elements Practice</title>
</head>
<body>

<!-- Block-level elements: take full width, start on a new line -->
<h2>Block-Level Elements</h2>
<div>This is a div (block element).</div>
<p>This is a paragraph (block element).</p>

<!-- Inline elements: take only as much width as needed, stay in line with text -->
<h2>Inline Elements</h2>
<p>
    This sentence has an <strong>important word</strong>, an
    <em>emphasized word</em>, and a <span>styled span</span> all inline.
</p>

</body>
</html>
