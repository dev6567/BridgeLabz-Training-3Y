<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rowspan and Colspan Practice</title>
</head>
<body>

<h2>Table with Rowspan and Colspan</h2>
<table border="1">
    <tr>
        <th colspan="2">Student Info</th>
    </tr>
    <tr>
        <td rowspan="2">Dev Sharma</td>
        <td>Math: 90</td>
    </tr>
    <tr>
        <td>Science: 85</td>
    </tr>
</table>

</body>
</html>
