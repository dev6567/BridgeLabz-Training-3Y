<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>
<body>

    <h1>Course Registration</h1>

    <!-- Fieldset grouping registration fields -->
    <fieldset>
        <legend>Student Details</legend>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="course">Select Course:</label>
        <select id="course" name="course">
            <option value="html">HTML Fundamentals</option>
            <option value="css">CSS Fundamentals</option>
            <option value="js">JavaScript Basics</option>
            <option value="bootstrap">Bootstrap Essentials</option>
        </select>

    </fieldset>

    <br>

    <!-- Table showing available course schedules -->
    <h2>Available Course Schedules</h2>
    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM - 12:00 PM</td>
            <td>Mr. Sharma</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>2:00 PM - 4:00 PM</td>
            <td>Ms. Verma</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>11:00 AM - 1:00 PM</td>
            <td>Mr. Khan</td>
        </tr>
    </table>

</body>
</html>
