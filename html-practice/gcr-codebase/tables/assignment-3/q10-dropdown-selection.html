<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown-based Selection Page</title>
</head>
<body>

    <h1>Choose Your Travel Preferences</h1>

    <!-- Country dropdown with pre-selected option -->
    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="usa">USA</option>
        <option value="india" selected>India</option>
        <option value="japan">Japan</option>
    </select>
    <br><br>

    <!-- State dropdown with pre-selected option -->
    <label for="state">State:</label>
    <select id="state" name="state">
        <option value="maharashtra">Maharashtra</option>
        <option value="rajasthan" selected>Rajasthan</option>
        <option value="kerala">Kerala</option>
    </select>
    <br><br>

    <!-- City dropdown with pre-selected option -->
    <label for="city">City:</label>
    <select id="city" name="city">
        <option value="jaipur" selected>Jaipur</option>
        <option value="udaipur">Udaipur</option>
        <option value="jodhpur">Jodhpur</option>
    </select>
    <br><br>

    <!-- Favorite Tourist Place dropdown with pre-selected option -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option value="hawa-mahal" selected>Hawa Mahal</option>
        <option value="amer-fort">Amer Fort</option>
        <option value="city-palace">City Palace</option>
    </select>
    <br><br>

    <!-- Summary paragraph -->
    <p>
        Based on your selections, you are interested in visiting Jaipur,
        Rajasthan, India, and would love to see the Hawa Mahal.
    </p>

</body>
</html>
