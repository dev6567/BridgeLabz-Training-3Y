<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Basic Table Practice</title>
</head>
<body>

<h2>Simple Table</h2>
<table border="1">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>
    <tr>
        <td>Dev Sharma</td>
        <td>20</td>
        <td>Delhi</td>
    </tr>
    <tr>
        <td>Rahul Verma</td>
        <td>22</td>
        <td>Mumbai</td>
    </tr>
</table>

</body>
</html>
