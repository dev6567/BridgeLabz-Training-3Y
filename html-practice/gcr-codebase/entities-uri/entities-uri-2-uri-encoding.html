<title>URI Encoding Practice</title>

<body>

<h2>URI Encoding Example</h2>
<p>A space in a URL is encoded as %20, and an ampersand as %26.</p>
<p>
    Example link:
    <a href="https://example.com/search?q=html%20basics">https://example.com/search?q=html%20basics</a>
</p>

</body>
