<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Span Elements Example</title>
</head>
<body>

    <!-- Paragraph using three span elements to label different parts of the text -->
    <p>
        My favorite subjects are
        <span title="Programming Language">HTML</span>,
        <span title="Programming Language">CSS</span>, and
        <span title="Scripting Language">JavaScript</span>.
    </p>

</body>
</html>
