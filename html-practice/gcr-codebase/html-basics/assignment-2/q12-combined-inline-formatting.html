<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Combined Inline Formatting Example</title>
</head>
<body>

    <!-- Creative paragraph combining strong, em, mark, small, and br -->
    <p>
        Learning to code can be <strong>challenging</strong> at first, <br>
        but with <em>consistent practice</em>, it becomes <mark>enjoyable</mark>
        and rewarding. <small>Last updated recently.</small>
    </p>

</body>
</html>
