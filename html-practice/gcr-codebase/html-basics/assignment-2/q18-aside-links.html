<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aside Example - Useful Links</title>
</head>
<body>

    <header>
        <h1>Dev Sharma's Portfolio</h1>
    </header>

    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Contact</a>
    </nav>

    <main>
        <article>
            <h2>My First Blog</h2>
            <p>
                Today I started learning semantic HTML tags and how they
                structure a web page.
            </p>
        </article>
    </main>

    <!-- Aside section with useful links -->
    <aside>
        <h2>Useful Links</h2>
        <ul>
            <li><a href="https://github.com/dev6567" target="_blank">My GitHub Profile</a></li>
            <li><a href="https://leetcode.com/u/UH8saUw4XI/" target="_blank">My LeetCode Profile</a></li>
        </ul>
    </aside>

</body>
</html>
