<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blockquote and Q Tag Example</title>
</head>
<body>
<h1>Quotations</h1>

<!-- Long quote using blockquote -->
<blockquote>
    The only way to do great work is to love what you do. If you haven't
    found it yet, keep looking. Don't settle.
</blockquote>

<!-- Short inline quote using q, with an HTML entity included -->
<p>
    As someone once said, <q>knowledge is power &amp; freedom</q>, which I
    believe completely.
</p>
</body>
</html>
