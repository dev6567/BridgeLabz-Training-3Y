<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Map Embed</title>
</head>
<body>
<h1>My City on Google Maps</h1>
<!-- loading="lazy" delays loading the map until it is close to the visible viewport, improving page load speed -->
<iframe title="Google Map of my city" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3888.0!2d77.2090!3d28.6139" width="600" height="450" loading="lazy"></iframe>
</body>
</html>
