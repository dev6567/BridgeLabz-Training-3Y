<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Upload Form</title>
</head>
<body>
<h1>Upload Your Photo</h1>
<form method="post" action="#">
    <label for="photo">Choose a file:</label>
    <input type="file" id="photo" name="photo" accept=".jpg,.png">
    <input type="submit" value="Upload">
</form>
<p>Only .jpg and .png image files are allowed to be uploaded.</p>
</body>
</html>
