<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Form</title>
</head>
<body>
<h1>Submit Your Info</h1>
<form target="result-frame" action="result.html" method="get">
    <input type="text" name="info" placeholder="Type something">
    <input type="submit" value="Submit">
</form>

<!-- Iframe loads result.html after the form above is submitted -->
<iframe name="result-frame" title="Result" width="400" height="150"></iframe>
</body>
</html>
