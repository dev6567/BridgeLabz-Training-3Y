<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport meta tag is the HTML-side foundation of responsive design;
         it tells the browser to match the page width to the device width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive HTML - Viewport Practice</title>
</head>
<body>

<h2>Responsive Viewport Example</h2>
<p>
    This page includes a viewport meta tag, which is the first step toward
    making a page responsive. Actual responsive layouts (media queries, fluid
    grids) are built using CSS on top of this HTML foundation.
</p>

</body>
</html>
