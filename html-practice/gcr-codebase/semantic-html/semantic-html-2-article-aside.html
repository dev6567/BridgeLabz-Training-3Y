<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Article and Aside Practice</title>
</head>
<body>

<main>
    <article>
        <h2>My First Article</h2>
        <p>This is an example of using the article tag for standalone content.</p>
    </article>
</main>

<aside>
    <h2>Related Links</h2>
    <ul>
        <li><a href="#">Link One</a></li>
        <li><a href="#">Link Two</a></li>
    </ul>
</aside>

</body>
</html>
