<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Ticket Booking</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding: 30px; }
    .card { background: #fff; padding: 24px; border-radius: 8px; width: 340px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    input.valid { border-color: green; }
    input.invalid { border-color: red; }
    .error { color: red; font-size: 13px; min-height: 16px; margin-top: 3px; }
    button { width: 100%; padding: 10px; background: #2d6cdf; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    #ticket { margin-top: 16px; padding: 12px; border: 2px dashed #2d6cdf; border-radius: 6px; display: none; }
    #ticket p { margin: 4px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Book Movie Tickets</h2>
    <form id="booking-form" novalidate>
      <div class="field"><label for="name">Name</label><input id="name" type="text"><div class="error" id="name-error"></div></div>
      <div class="field"><label for="email">Email</label><input id="email" type="text"><div class="error" id="email-error"></div></div>
      <div class="field"><label for="seats">Seats (1 to 10)</label><input id="seats" type="text"><div class="error" id="seats-error"></div></div>
      <button type="submit">Book Tickets</button>
    </form>
    <div id="ticket"></div>
  </div>
  <script src="q5_movie_booking.js"></script>
</body>
</html>
