<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding: 30px; }
    form { background: #fff; padding: 24px; border-radius: 8px; width: 340px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2d6cdf; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    #errors { color: red; font-size: 13px; margin: 0 0 12px 18px; padding: 0; }
    #success { color: green; font-weight: bold; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <form id="login-form" novalidate>
    <h2>Login</h2>
    <div class="field"><label for="username">Username</label><input id="username" type="text"></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password"></div>
    <ul id="errors"></ul>
    <button type="submit">Login</button>
    <div id="success"></div>
  </form>
  <script src="q7_login_validation.js"></script>
</body>
</html>
