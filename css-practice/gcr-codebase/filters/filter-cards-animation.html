<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Cards with Animation</title>
<link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>
<h1>Our Team</h1>
<main class="profile-row">
    <article class="profile-card">
        <img src="person1.jpg" alt="Profile photo of Aman">
        <h2>Aman</h2>
        <p>Frontend Developer</p>
    </article>
    <article class="profile-card">
        <img src="person2.jpg" alt="Profile photo of Riya">
        <h2>Riya</h2>
        <p>UI Designer</p>
    </article>
    <article class="profile-card">
        <img src="person3.jpg" alt="Profile photo of Kabir">
        <h2>Kabir</h2>
        <p>Backend Developer</p>
    </article>
</main>
</body>
</html>
