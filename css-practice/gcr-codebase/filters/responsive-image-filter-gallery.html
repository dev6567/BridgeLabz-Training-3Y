<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Filter Gallery</title>
<link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
<header>
    <h1>Image Filter Gallery</h1>
</header>

<main class="gallery">
    <figure>
        <img class="blur" src="img1.jpg" alt="Mountain landscape with blur filter">
        <figcaption>Blur</figcaption>
    </figure>
    <figure>
        <img class="grayscale" src="img2.jpg" alt="Beach view with grayscale filter">
        <figcaption>Grayscale</figcaption>
    </figure>
    <figure>
        <img class="sepia" src="img3.jpg" alt="Forest with sepia filter">
        <figcaption>Sepia</figcaption>
    </figure>
    <figure>
        <img class="brightness" src="img4.jpg" alt="Desert with brightness filter">
        <figcaption>Brightness</figcaption>
    </figure>
    <figure>
        <img class="contrast" src="img5.jpg" alt="City with contrast filter">
        <figcaption>Contrast</figcaption>
    </figure>
    <figure>
        <img class="hue" src="img6.jpg" alt="Lake with hue-rotate filter">
        <figcaption>Hue Rotate</figcaption>
    </figure>
</main>
</body>
</html>
