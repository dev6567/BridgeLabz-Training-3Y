<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Comparison Layout</title>
<link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
<h1>Before and After</h1>
<main class="compare">
    <figure>
        <img src="photo.jpg" alt="Original photo without any filter">
        <figcaption>Before (original)</figcaption>
    </figure>
    <figure>
        <img class="filtered" src="photo.jpg" alt="Same photo with brightness and contrast filter">
        <figcaption>After (filter applied, hover to remove)</figcaption>
    </figure>
</main>
</body>
</html>
