<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box Model Exploration</title>
<link rel="stylesheet" href="q8-box-model.css">
</head>
<body>
<div class="demo-wrapper">
    <div class="margin-layer">
        Margin
        <div class="border-layer">
            Border
            <div class="padding-layer">
                Padding
                <div class="content-layer">Content</div>
            </div>
        </div>
    </div>
</div>

<p class="explanation">
    Content is the innermost area holding text/images. Padding is the space
    around content, inside the border. Border wraps around padding. Margin
    is the outermost space separating the box from other elements.
</p>

<div class="box-sizing-demo">
    <div class="default-box">Default box-sizing (content-box)</div>
    <div class="border-box">box-sizing: border-box</div>
</div>
</body>
</html>
