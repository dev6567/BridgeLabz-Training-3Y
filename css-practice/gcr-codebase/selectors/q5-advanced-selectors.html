<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced CSS Selectors</title>
<link rel="stylesheet" href="q5-advanced-selectors.css">
</head>
<body>
<h1>Advanced Selectors Demo</h1>

<form>
    <input type="text" placeholder="Text input (attribute selector)">
    <input type="email" placeholder="Email input">
</form>

<p>Visit <a href="https://example.com">a secure link</a> or <a href="http://example.com">an insecure one</a>.</p>

<ul class="item-list">
    <li>Item One</li>
    <li>Item Two</li>
    <li>Item Three</li>
    <li>Item Four</li>
</ul>

<div class="parent">
    <p>Direct child paragraph</p>
    <div><p>Nested paragraph (not direct child)</p></div>
</div>
</body>
</html>
