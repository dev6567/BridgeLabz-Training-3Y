<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pseudo-Classes Demo</title>
<link rel="stylesheet" href="q1-pseudo-classes.css">
</head>
<body>
<h1>Pseudo-Classes</h1>
<div class="demo-row">
    <div class="demo-item">
        <a href="#" class="hover-link">Hover Link</a>
        <p>:hover</p>
    </div>
    <div class="demo-item">
        <input type="text" class="focus-input" placeholder="Click me">
        <p>:focus</p>
    </div>
    <div class="demo-item">
        <button class="active-btn">Press Me</button>
        <p>:active</p>
    </div>
    <div class="demo-item">
        <ul class="nth-list">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
            <li>Item 4</li>
        </ul>
        <p>:nth-child(even)</p>
    </div>
</div>
</body>
</html>
