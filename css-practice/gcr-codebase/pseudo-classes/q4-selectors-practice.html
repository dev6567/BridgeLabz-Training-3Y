<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Selectors Practice</title>
<link rel="stylesheet" href="q4-selectors-practice.css">
</head>
<body>
<header><h1>Selectors Practice</h1></header>

<main>
    <p>This is a plain paragraph (element selector).</p>
    <p class="highlight">This paragraph uses a class selector.</p>
    <p id="special">This paragraph uses an ID selector.</p>

    <ul class="parent-list">
        <li>Direct child item</li>
        <li>Another direct child
            <ul><li>Nested item (descendant)</li></ul>
        </li>
    </ul>

    <a href="https://example.com">Link with attribute selector</a>
</main>

<footer><p>&copy; 2025 Selectors Demo</p></footer>
</body>
</html>
