<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Gallery - Grid</title>
<link rel="stylesheet" href="q8-photo-gallery.css">
</head>
<body>
<div class="gallery">
    <figure>
        <img src="photo1.jpg" alt="Mountain landscape">
        <figcaption>Mountains</figcaption>
    </figure>
    <figure>
        <img src="photo2.jpg" alt="Beach view">
        <figcaption>Beach</figcaption>
    </figure>
    <figure>
        <img src="photo3.jpg" alt="City skyline">
        <figcaption>City</figcaption>
    </figure>
</div>
</body>
</html>
