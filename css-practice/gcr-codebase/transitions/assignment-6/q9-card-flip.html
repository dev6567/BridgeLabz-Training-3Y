<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Flip Animation</title>
<link rel="stylesheet" href="q9-card-flip.css">
</head>
<body>
<div class="flip-container">
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <h2>My Project</h2>
                <img src="project.jpg" alt="Project thumbnail">
            </div>
            <div class="flip-card-back">
                <p>This project demonstrates a responsive HTML/CSS layout.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
