<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Combined Flexbox and Grid Layout</title>
<link rel="stylesheet" href="q10-combined-layout.css">
</head>
<body>
<header class="site-header">
    <div class="logo">MyLogo</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="main-grid">
    <article class="article">
        <h1 class="fade-title">Welcome to My Site</h1>
        <div class="boxes">
            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
        </div>
    </article>
    <aside class="sidebar">Sidebar Content</aside>
</div>

<footer class="site-footer">
    <p>&copy; 2025 My Site</p>
</footer>
</body>
</html>
