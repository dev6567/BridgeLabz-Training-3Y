<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Transformations Showcase</title>
<link rel="stylesheet" href="q6-transformations.css">
</head>
<body>
<h1>Transformations</h1>
<div class="transform-row">
    <div class="transform-item">
        <div class="box box-rotate">Rotate</div>
        <p>rotate()</p>
    </div>
    <div class="transform-item">
        <div class="box box-scale">Scale</div>
        <p>scale()</p>
    </div>
    <div class="transform-item">
        <div class="box box-translate">Translate</div>
        <p>translate()</p>
    </div>
    <div class="transform-item">
        <div class="box box-skew">Skew</div>
        <p>skew()</p>
    </div>
</div>
</body>
</html>
